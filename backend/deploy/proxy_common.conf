# /etc/nginx/proxy_common.conf — `nginx.conf.example` dagi har proxy location
# shu faylni `include` qiladi.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# ATAYLAB `$proxy_add_x_forwarded_for` EMAS: u client yuborgan sarlavhaga
# qo'shib qo'yadi. Backend `TRUSTED_PROXY_COUNT=1` da avval `X-Real-IP` ga,
# u bo'lmasa XFF'ning o'ngdan 1-elementiga ishonadi
# (`apps/common/throttling.py:client_ip`) — ikkalasi ham nginx qo'ygan qiymat.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;
