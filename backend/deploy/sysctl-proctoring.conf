# /etc/sysctl.d/90-proctoring.conf  ->  sudo sysctl --system
# 5000 client, login to'lqini (1–5 daq), gunicorn backlog 4096.
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.ip_local_port_range = 10240 65000
net.ipv4.tcp_tw_reuse = 1
fs.file-max = 1000000
# Swap = SLO buzilishi; Redis uchun ham.
vm.swappiness = 1
vm.overcommit_memory = 1
# THP Redis'ga zarar: systemd/rc.local'da
#   echo never > /sys/kernel/mm/transparent_hugepage/enabled
